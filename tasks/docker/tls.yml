---
- name: Ensure TLS directory exists
  ansible.builtin.file:
    path: "{{ synapse_docker_data_dir }}/tls"
    state: directory
    mode: "0750"

# Let's Encrypt
- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present
  when: synapse_tls_mode == 'letsencrypt'

- name: Obtain Let's Encrypt certificate
  ansible.builtin.command:
    cmd: >-
      certbot certonly --standalone
      --non-interactive --agree-tos
      --email {{ synapse_letsencrypt_email }}
      --domain {{ synapse_letsencrypt_domain }}
    creates: "/etc/letsencrypt/live/{{ synapse_letsencrypt_domain }}/fullchain.pem"
  when: synapse_tls_mode == 'letsencrypt'

- name: Symlink Let's Encrypt certs to data dir
  ansible.builtin.file:
    src: "/etc/letsencrypt/live/{{ synapse_letsencrypt_domain }}/{{ item.src }}"
    dest: "{{ synapse_docker_data_dir }}/tls/{{ item.dest }}"
    state: link
  loop:
    - { src: fullchain.pem, dest: fullchain.pem }
    - { src: privkey.pem, dest: privkey.pem }
  when: synapse_tls_mode == 'letsencrypt'

- name: Enable certbot renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: true
  when: synapse_tls_mode == 'letsencrypt'

# Self-signed
- name: Generate self-signed private key
  community.crypto.openssl_privatekey:
    path: "{{ synapse_docker_data_dir }}/tls/privkey.pem"
    size: 4096
    mode: "0640"
  when: synapse_tls_mode == 'selfsigned'

- name: Generate self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ synapse_docker_data_dir }}/tls/fullchain.pem"
    privatekey_path: "{{ synapse_docker_data_dir }}/tls/privkey.pem"
    provider: selfsigned
    selfsigned_not_after: "+3650d"
    mode: "0644"
  when: synapse_tls_mode == 'selfsigned'
