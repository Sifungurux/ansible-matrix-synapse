---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: synapse-server
    image: debian:bookworm
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  inventory:
    host_vars:
      synapse-server:
        synapse_server_name: test.matrix.local
        synapse_deployment_mode: server
        synapse_database_engine: sqlite
        synapse_tls_mode: selfsigned
        synapse_registration_shared_secret: test-secret-change-me
        synapse_database_password: not-used-for-sqlite
        synapse_create_admin: true
        synapse_admin_user: admin
        synapse_admin_password: testpassword

verifier:
  name: ansible
